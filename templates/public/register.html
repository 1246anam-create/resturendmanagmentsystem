{% extends "public/base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      {% if header and header.logo %}<img src="{{ url_for('static', filename=header.logo) }}" alt="logo">{% endif %}
      <h2>Create Account</h2>
      <p class="text-muted">Join us for a better experience</p>
    </div>
    <form method="POST" action="{{ url_for('public.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required class="form-control"></div>
      <div class="form-group"><label>Username</label><input type="text" name="username" required class="form-control"></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required class="form-control"></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" class="form-control"></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" class="form-control"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Register</button>
    </form>
    <p class="text-center mt-2 small">Already have an account? <a href="{{ url_for('public.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
