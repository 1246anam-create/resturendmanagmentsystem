{% extends "customer/base.html" %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ customer.full_name }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" value="{{ customer.user.email if customer.user else '' }}">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ customer.phone or '' }}">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2">{{ customer.address or '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Profile Image</label>
        <img src="{{ url_for('static', filename=customer.profile_image) }}" class="thumb-lg" onerror="this.src='{{ url_for('static', filename='uploads/customers/default.png') }}'"><br>
        <input type="file" name="profile_image" class="form-control" accept="image/*">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" class="form-control" placeholder="Leave blank to keep">
      </div>
      <div class="form-group" style="grid-column:1/-1"><button class="btn btn-primary">Update Profile</button></div>
    </form>
  </div>
</div>
{% endblock %}
