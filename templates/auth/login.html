{% extends "public/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      {% if header and header.logo %}<img src="{{ url_for('static', filename=header.logo) }}" alt="logo">{% endif %}
      <h2>Welcome Back</h2>
      <p class="text-muted">Sign in to your account</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required class="form-control" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required class="form-control" placeholder="Enter password">
      </div>
      <div class="form-group form-check">
        <input type="checkbox" name="remember" id="remember"><label for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>
    <p class="text-center mt-2 small">Don't have an account? <a href="{{ url_for('public.register') }}">Register</a></p>
    <p class="text-center small"><a href="{{ url_for('public.home') }}">← Back to website</a></p>
  </div>
</div>
{% endblock %}
