{% extends "admin/base.html" %}
{% block title %}{% if item %}Edit Item{% else %}Add Item{% endif %}{% endblock %}
{% block page_title %}{% if item %}Edit Inventory Item{% else %}Add Inventory Item{% endif %}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" class="form-control" value="{{ item.category if item else 'general' }}">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" step="0.01" name="quantity" class="form-control" value="{{ item.quantity if item else 0 }}">
      </div>
      <div class="form-group">
        <label>Unit</label>
        <input type="text" name="unit" class="form-control" value="{{ item.unit if item else 'pcs' }}">
      </div>
      <div class="form-group">
        <label>Minimum Stock</label>
        <input type="number" step="0.01" name="minimum_stock" class="form-control" value="{{ item.minimum_stock if item else 10 }}">
      </div>
      <div class="form-group">
        <label>Purchase Price</label>
        <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{ item.purchase_price if item else 0 }}">
      </div>
      <div class="form-group">
        <label>Supplier</label>
        <select name="supplier_id" class="form-control">
          <option value="">None</option>
          {% for s in suppliers %}<option value="{{ s.id }}" {% if item and item.supplier_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Expiry Date</label>
        <input type="date" name="expiry_date" class="form-control" value="{{ item.expiry_date.isoformat() if item and item.expiry_date else '' }}">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.inventory') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
