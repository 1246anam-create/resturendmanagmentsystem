{% extends "admin/base.html" %}
{% block title %}{% if item %}Edit Item{% else %}Add Item{% endif %}{% endblock %}
{% block page_title %}{% if item %}Edit Menu Item{% else %}Add Menu Item{% endif %}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" class="form-control" required>
          <option value="">Select Category</option>
          {% for c in categories %}<option value="{{ c.id }}" {% if item and item.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Price *</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ item.price if item else '' }}" required>
      </div>
      <div class="form-group">
        <label>Discount (%)</label>
        <input type="number" step="0.01" name="discount" class="form-control" value="{{ item.discount if item else 0 }}">
      </div>
      <div class="form-group">
        <label>Preparation Time (min)</label>
        <input type="number" name="preparation_time" class="form-control" value="{{ item.preparation_time if item else 15 }}">
      </div>
      <div class="form-group">
        <label>Display Order</label>
        <input type="number" name="display_order" class="form-control" value="{{ item.display_order if item else 0 }}">
      </div>
      <div class="form-group">
        <label>Availability</label>
        <select name="availability" class="form-control">
          <option value="available" {% if item and item.availability=='available' %}selected{% endif %}>Available</option>
          <option value="unavailable" {% if item and item.availability=='unavailable' %}selected{% endif %}>Unavailable</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status" class="form-control">
          <option value="active" {% if not item or item.status=='active' %}selected{% endif %}>Active</option>
          <option value="inactive" {% if item and item.status=='inactive' %}selected{% endif %}>Inactive</option>
        </select>
      </div>
      <div class="form-group">
        <label>Featured</label>
        <select name="featured" class="form-control">
          <option value="0" {% if not item or not item.featured %}selected{% endif %}>No</option>
          <option value="1" {% if item and item.featured %}selected{% endif %}>Yes</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="3">{{ item.description if item else '' }}</textarea>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Ingredients</label>
        <textarea name="ingredients" class="form-control" rows="2">{{ item.ingredients if item else '' }}</textarea>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Image</label>
        {% if item and item.image %}<img src="{{ url_for('static', filename=item.image) }}" class="thumb-lg" onerror="this.src='{{ url_for('static', filename='uploads/products/default.png') }}'"><br>{% endif %}
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.menu') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
