{% extends "admin/base.html" %}
{% block title %}New Purchase{% endblock %}
{% block page_title %}New Purchase{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST" class="form-grid" id="purchase-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Supplier *</label>
        <select name="supplier_id" class="form-control" required>
          <option value="">Select Supplier</option>
          {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Purchase Date</label>
        <input type="date" name="purchase_date" class="form-control" value="{{ today.isoformat() if today else '' }}">
      </div>
      <div class="form-group">
        <label>Payment Status</label>
        <select name="payment_status" class="form-control">
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="partially_paid">Partially Paid</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Note</label>
        <textarea name="note" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <h4>Items</h4>
        <div id="purchase-items">
          <div class="purchase-row d-flex gap-1" style="margin-bottom:8px">
            <select name="item_id" class="form-control">{% for i in items %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select>
            <input type="number" step="0.01" name="qty" class="form-control" placeholder="Qty" style="max-width:100px">
            <input type="number" step="0.01" name="price" class="form-control" placeholder="Unit Price" style="max-width:140px">
          </div>
        </div>
        <button type="button" class="btn btn-outline btn-sm" onclick="RMS.addPurchaseRow()">+ Add Item</button>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <button class="btn btn-primary">Save Purchase</button>
        <a href="{{ url_for('admin.purchases') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
RMS.addPurchaseRow = function(){
  var row = document.querySelector('.purchase-row').cloneNode(true);
  document.getElementById('purchase-items').appendChild(row);
};
</script>
{% endblock %}
